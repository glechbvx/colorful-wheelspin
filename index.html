
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Wheel - วงล้อสุ่มออนไลน์</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px 35px;
  min-height: 100vh;
  font-family: "Segoe UI", Tahoma, sans-serif;
  color: #25284b;
  background: linear-gradient(135deg, #e0f2fe, #fce7f3, #ede9fe);
}

header {
  text-align: center;
  margin: 10px auto 24px;
}

header h1 {
  margin: 0;
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 900;
  color: #7954ed;
}

header p {
  color: #777b9a;
  margin-top: 8px;
}

.container {
  width: 100%;
  max-width: 580px;
  margin: auto;
  padding: 22px;
  border-radius: 24px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 15px 45px rgba(86, 72, 160, .15);
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 10px;
}

textarea {
  display: block;
  width: 100%;
  height: 150px;
  padding: 13px;
  border: 2px solid #e5e7f5;
  border-radius: 14px;
  font: inherit;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: #9270ff;
  box-shadow: 0 0 0 3px #9270ff20;
}

.counter {
  margin: 9px 0 14px;
  font-size: 13px;
  color: #8186a3;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 12px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 15px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}

button:hover {
  filter: brightness(.97);
  transform: translateY(-1px);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}

.secondary {
  flex: 1;
  min-width: 120px;
  color: #6551c8;
  background: #f0edff;
}

.wheel-wrap {
  position: relative;
  width: min(82vw, 360px);
  aspect-ratio: 1;
  margin: 32px auto 24px;
}

#wheelCanvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 7px solid #fff;
  box-shadow: 0 8px 28px #433b7325;
}

.pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  width: 0;
  height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 35px solid #ff416c;
  filter: drop-shadow(0 3px 3px #0002);
}

.spin-button {
  display: block;
  width: 100%;
  padding: 16px;
  color: #fff;
  font-size: 18px;
  background: linear-gradient(100deg, #3b82f6, #8b5cf6, #ec4899);
  box-shadow: 0 8px 22px #8660ed35;
}

#result {
  display: none;
  margin-top: 18px;
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  background: linear-gradient(120deg, #fff0f7, #f1edff);
  color: #a53dd0;
  font-size: 21px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #a0a3b8;
  margin-top: 20px;
}

@media (max-width: 420px) {
  .container {
    padding: 16px;
  }

  .button-row button {
    font-size: 13px;
    padding: 11px 9px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎡 Lucky Wheel</h1>
  <p>วงล้อสุ่มออนไลน์ • สีสันสดใส • ใช้งานฟรี</p>
</header>

<main class="container">

  <label for="itemsInput">
    📝 รายชื่อ / ตัวเลือก (หนึ่งรายการต่อบรรทัด)
  </label>

  <textarea id="itemsInput">รางวัลที่ 1 🎉
รางวัลที่ 2 🎁
รางวัลที่ 3 ⭐
รางวัลที่ 4 💎
รางวัลที่ 5 🏆
รางวัลที่ 6 🎊
รางวัลที่ 7 ❤️
รางวัลที่ 8 🔥</textarea>

  <div class="counter" id="counter"></div>

  <div class="button-row">
    <button class="secondary" id="shuffleBtn">
      🔀 สลับรายการ
    </button>

    <button class="secondary" id="clearBtn">
      🗑️ ล้างรายการ
    </button>

    <button class="secondary" id="resetBtn">
      ↩️ คืนค่าเริ่มต้น
    </button>
  </div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
  </div>

  <button class="spin-button" id="spinBtn">
    🎯 หมุนวงล้อ
  </button>

  <div id="result" role="status" aria-live="polite"></div>

  <div class="note">
    ✨ ปรับรายชื่อและสลับลำดับได้ตามต้องการ
  </div>

</main>

<script>
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("itemsInput");
const counter = document.getElementById("counter");
const spinBtn = document.getElementById("spinBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const clearBtn = document.getElementById("clearBtn");
const resetBtn = document.getElementById("resetBtn");
const result = document.getElementById("result");

const defaultItems = [
  "รางวัลที่ 1 🎉",
  "รางวัลที่ 2 🎁",
  "รางวัลที่ 3 ⭐",
  "รางวัลที่ 4 💎",
  "รางวัลที่ 5 🏆",
  "รางวัลที่ 6 🎊",
  "รางวัลที่ 7 ❤️",
  "รางวัลที่ 8 🔥"
];

const colors = [
  "#ff4f87",
  "#ff944d",
  "#ffd84d",
  "#57cf75",
  "#25c9d8",
  "#448aff",
  "#8b5cf6",
  "#c44dff",
  "#ff6b6b",
  "#f472b6",
  "#38bdf8",
  "#a3e635"
];

let items = [];
let spinning = false;
let rotation = 0;

function readItems() {
  return input.value
    .split(/\r?\n/)
    .map(item => item.trim())
    .filter(Boolean);
}

function updateWheel() {
  if (spinning) return;

  items = readItems();
  counter.textContent = `ตัวเลือกทั้งหมด: ${items.length} รายการ`;
  result.style.display = "none";
  drawWheel();
}

function drawWheel() {
  const size = canvas.width;
  const center = size / 2;
  const radius = center - 12;

  ctx.clearRect(0, 0, size, size);

  if (items.length === 0) {
    ctx.beginPath();
    ctx.arc(center, center, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#f0edff";
    ctx.fill();
    ctx.fillStyle = "#8178ad";
    ctx.font = "bold 25px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("เพิ่มรายการก่อน", center, center);
    return;
  }

  const arc = 2 * Math.PI / items.length;

  items.forEach((item, index) => {
    const start = -Math.PI / 2 + index * arc;
    const end = start + arc;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[index % colors.length];
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";

    const fontSize = Math.max(
      12, Math.min(23, 230 / items.length)
    );

    ctx.font = `bold ${fontSize}px sans-serif`;

    let text = item;
    while (
      ctx.measureText(text).width > radius * .66 &&
      text.length > 3
    ) {
      text = text.slice(0, -2) + "…";
    }

    ctx.fillText(text, radius - 24, 0);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(center, center, 29, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
  ctx.strokeStyle = "#f0dfff";
  ctx.lineWidth = 5;
  ctx.stroke();
}

function shuffleItems() {
  if (spinning) return;

  items = readItems();

  if (items.length < 2) {
    alert("กรุณาใส่อย่างน้อย 2 รายการเพื่อสลับลำดับ");
    return;
  }

  // สุ่มสลับลำดับรายการด้วย Fisher-Yates
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  input.value = items.join("\n");
  updateWheel();

  // บันทึกชุดข้อมูลไว้ในเบราว์เซอร์
  saveItems();
}

function clearItems() {
  if (spinning) return;

  input.value = "";
  updateWheel();
  saveItems();
}

function resetItems() {
  if (spinning) return;

  input.value = defaultItems.join("\n");
  rotation = 0;

  canvas.style.transition = "none";
  canvas.style.transform = "rotate(0deg)";

  updateWheel();
  saveItems();
}

function saveItems() {
  try {
    localStorage.setItem("luckyWheelItems", input.value);
  } catch (error) {
    // เว็บยังทำงานได้แม้เบราว์เซอร์ไม่อนุญาตให้บันทึก
  }
}

function spinWheel() {
  if (spinning) return;

  items = readItems();

  if (items.length === 0) {
    alert("กรุณากรอกตัวเลือกก่อนหมุน");
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  shuffleBtn.disabled = true;
  clearBtn.disabled = true;
  resetBtn.disabled = true;
  result.style.display = "none";

  // ล็อกผลให้เป็นรายการแรกของลำดับปัจจุบัน
  const targetIndex = 0;

  const arcDegrees = 360 / items.length;

  // ตำแหน่งกึ่งกลางช่องแรกใต้ลูกศรด้านบน
  const targetAngle = 360 - arcDegrees / 2;
  const currentAngle = ((rotation % 360) + 360) % 360;
  const adjustment =
    (targetAngle - currentAngle + 360) % 360;

  rotation += 360 * 6 + adjustment;

  canvas.style.transition =
    "transform 5s cubic-bezier(.12,.8,.18,1)";
  canvas.style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {
    spinning = false;
    spinBtn.disabled = false;
    shuffleBtn.disabled = false;
    clearBtn.disabled = false;
    resetBtn.disabled = false;

    result.textContent =
      "🎉 ผลลัพธ์: " + items[targetIndex];
    result.style.display = "block";

    // คงมุมสุดท้ายไว้สำหรับการหมุนครั้งถัดไป
    rotation = ((rotation % 360) + 360) % 360;

    canvas.style.transition = "none";
    canvas.style.transform = `rotate(${rotation}deg)`;
  }, 5100);
}

input.addEventListener("input", () => {
  updateWheel();
  saveItems();
});

shuffleBtn.addEventListener("click", shuffleItems);
clearBtn.addEventListener("click", clearItems);
resetBtn.addEventListener("click", resetItems);
spinBtn.addEventListener("click", spinWheel);

try {
  const saved = localStorage.getItem("luckyWheelItems");
  if (saved !== null) {
    input.value = saved;
  }
} catch (error) {
  // ใช้รายการเริ่มต้นหากไม่สามารถอ่านข้อมูลได้
}

updateWheel();
</script>

</body>
</html>
